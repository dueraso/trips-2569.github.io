const Place=({k,h,n})=>{
 const p=P[k], tel=p[3], sm=[h?'เปิด '+h:'',n||'',tel].filter(Boolean).join(' · ');
 return html`<div className="pl">
  <div className="pn">${PI[p[0]]+' '+p[1]}${sm&&html`<small>${sm}</small>`}</div>
  <div className="bs"><a className="bt m" href=${link(p)} target="_blank" rel="noopener noreferrer">🗺️ แผนที่</a>${tel&&html`<a className="bt" href=${'tel:'+tel.replace(/-/g,'')}>📞 โทร</a>`}</div>
 </div>`;
};
const Stop=({s})=>{
 const [t,ti,nt,dr,kd,pl]=s;
 return html`<article className="stop" style=${{'--c':K[kd][1]}}>
  <div className="tm">${'🕒 '+t+(dr?' · '+(kd==='t'?'🚆 ':'🚗 ขับ ')+dr:'')}</div>
  <h3>${K[kd][0]+' '+ti}</h3>
  <p className="nt">${nt}</p>
  ${pl.map((p,i)=>html`<${Place} key=${i} k=${p[0]} h=${p[1]} n=${p[2]}/>`)}
 </article>`;
};
const Day=({i,go})=>{
 const D=DAYS[i], L=DAYS.length;
 return html`<section>
  <h2>${'วันที่ '+(i+1)+' · '+D.t}</h2>
  <p className="sub">${D.w+' '+D.d+' '+mo(D.d)+' '+yr(D.d)}</p>
  ${D.s.map((s,j)=>html`<${Stop} key=${j} s=${s}/>`)}
  ${D.sl&&html`<div className="sl" style=${{'--c':K[D.sl[0]][1]}}>${K[D.sl[0]][0]+' คืนนี้: '+D.sl[1]}</div>`}
  <div className="pg">
   ${i>0?html`<button className="bt" onClick=${()=>go(i-1)}>◀ วันก่อนหน้า</button>`:html`<span/>`}
   ${i<L-1?html`<button className="bt m" onClick=${()=>go(i+1)}>วันถัดไป ▶</button>`:html`<button className="bt" onClick=${()=>go(-1)}>🏠 กลับภาพรวม</button>`}
  </div>
 </section>`;
};

function App(){
 const parse=()=>DAYS.findIndex(x=>'d'+x.d===location.hash.slice(1));
 const [v,setV]=useState(parse);
 useEffect(()=>{const f=()=>setV(parse());window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
 const go=i=>{
  try{location.hash=i<0?'all':'d'+DAYS[i].d}catch(_){}
  setV(i);
  window.scrollTo({top:document.getElementById('wrap').offsetTop,behavior:'smooth'});
 };
 return html`<div className="wrap" id="wrap">
  <nav className="nav">
   <button className=${'nb'+(v<0?' on':'')} onClick=${()=>go(-1)}><b>🏠</b><span className="lb">ภาพรวม<small>สรุป + เช็กลิสต์</small></span></button>
   ${DAYS.map((D,i)=>html`<button key=${i} className=${'nb'+(v===i?' on':'')} onClick=${()=>go(i)}><b>${D.d}</b><span className="lb">${D.w+' '+mo(D.d)}<small>${D.t}</small></span></button>`)}
  </nav>
  <main>
   ${v<0?html`<${Over} go=${go}/>`:html`<${Day} i=${v} go=${go}/>`}
   <p className="ft">ชื่อสถานที่ เบอร์โทร และเวลาเปิดมาจาก Google Maps (ตรวจเมื่อ 7 พ.ย. 69) ช่วงปีใหม่เวลาอาจเปลี่ยน ควรโทรเช็กก่อนไป</p>
  </main>
 </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script>
